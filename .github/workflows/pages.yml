\outl0\strokewidth0 \strokec2 name: Build & Deploy Vite Static Site\
on:\
  push:\
    branches: [ main ]\
permissions:\
  contents: read\
  pages: write\
  id-token: write\
concurrency:\
  group: "pages"\
  cancel-in-progress: false\
jobs:\
  build:\
    runs-on: ubuntu-latest\
    steps:\
      - uses: actions/checkout@v4\
      - uses: actions/setup-node@v4\
        with:\
          node-version: 20\
          cache: npm\
      - run: npm ci\
      - run: npm run docs:build\
      - uses: actions/upload-pages-artifact@v3\
        with:\
          path: dist\
  deploy:\
    needs: build\
    runs-on: ubuntu-latest\
    environment: github-pages\
    steps:\
      - uses: actions/deploy-pages@v4}